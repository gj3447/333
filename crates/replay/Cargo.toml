[package]
name = "p333-replay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "333 v2 substrate Lane C — deterministic replay (GGRS-style rollback netcode). The safety law is DETERMINISM: the same input sequence replays to the same state; a step that depends on anything outside its inputs is caught. Production adopts ggrs."

