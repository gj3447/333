# ooptdd-loop spec — verify the REAL transfer333 multi-process node over TCP.
# Each gate binds (Longinus) to an event literal that run_node_probe ships ONLY when the
# behaviour is genuinely observed from live `node` child processes (4 authorities + submit).
# A regressed node (no consensus / diverged ledgers / applied double-spend / accepted
# skipped seq) -> the bound gate goes RED.
#
# Run:  cd CD/333 && <ooptdd-venv>/bin/ooptdd-loop run ooptdd/node_requirements.yaml --json
name: transfer333-node-conformance

target:
  mode: in_process
  callable: node_conformance_adapter:run_node_probe   # run_node_probe(backend, cid)
  backend: memory
  root: ooptdd

requirements:
  - id: REQ-FORGED-OWNER-REJECTED
    description: a wrong-key Alice order is rejected by all 4 authorities before slot admission
    gate:
      - {event: forged_owner_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-forged-owner-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_forged_owner_rejected
      must_emit: forged_owner_rejected

  - id: REQ-FORGED-ORDER-ZERO-VOTES
    description: the forged Alice order receives zero authority votes and causes zero certificate applications
    gate:
      - {event: forged_order_zero_votes, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-forged-order-zero-votes-20260715
      source: node_conformance_adapter.py
      symbol: _emit_forged_order_zero_votes
      must_emit: forged_order_zero_votes

  - id: REQ-OVERSPEND-REJECTED
    description: a valid Alice signature cannot certify an amount above her balance or consume sequence 0
    gate:
      - {event: overspend_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-overspend-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_overspend_rejected
      must_emit: overspend_rejected

  - id: REQ-DUPLICATE-AUTHORITY-KEY-REJECTED
    description: one physical authority key cannot be registered under four aliases to inflate quorum power
    gate:
      - {event: duplicate_authority_key_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-duplicate-authority-key-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_duplicate_authority_key_rejected
      must_emit: duplicate_authority_key_rejected

  - id: REQ-INVALID-GENESIS-REJECTED
    description: a premint allocation whose total supply exceeds u128 is rejected before authority startup
    gate:
      - {event: invalid_genesis_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-invalid-genesis-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_invalid_genesis_rejected
      must_emit: invalid_genesis_rejected

  - id: REQ-FORGERY-NO-SLOT-POISON
    description: after a forge-first rejection, valid Alice seed 42 certifies and applies the same alice sequence-0 slot
    gate:
      - {event: forgery_did_not_poison_slot, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-forgery-no-slot-poison-20260715
      source: node_conformance_adapter.py
      symbol: _emit_forgery_did_not_poison_slot
      must_emit: forgery_did_not_poison_slot

  - id: REQ-CERTIFY-OVER-TCP
    description: an honest transfer certifies across 4 separate TCP authority processes
    gate:
      - {event: node_certifies_over_tcp, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-certify-over-tcp-20260715
      source: node_conformance_adapter.py
      symbol: _emit_node_certifies_over_tcp
      must_emit: node_certifies_over_tcp

  - id: REQ-LEDGERS-CONVERGE
    description: all 4 independent authority ledgers apply the SAME balances (alice=70,bob=30)
    gate:
      - {event: authority_ledgers_converge, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-ledgers-converge-20260715
      source: node_conformance_adapter.py
      symbol: _emit_authority_ledgers_converge
      must_emit: authority_ledgers_converge

  - id: REQ-DOUBLE-SPEND-REJECTED
    description: a reused-seq spend gets no certificate AND leaves every ledger unchanged
    gate:
      - {event: double_spend_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-double-spend-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_double_spend_rejected
      must_emit: double_spend_rejected

  - id: REQ-OUT-OF-ORDER-REJECTED
    description: a skipped-seq spend gets no certificate (sequence ordering invariant holds)
    gate:
      - {event: out_of_order_rejected, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-out-of-order-rejected-20260715
      source: node_conformance_adapter.py
      symbol: _emit_out_of_order_rejected
      must_emit: out_of_order_rejected

  - id: REQ-CERT-ANTI-ENTROPY-REBROADCAST
    description: an authority that applied a certificate re-presents it during quiet periods (level-triggered anti-entropy, audit P1)
    gate:
      - {event: cert_anti_entropy_rebroadcast, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-cert-anti-entropy-rebroadcast-20260803
      source: node_conformance_adapter.py
      symbol: _emit_cert_anti_entropy_rebroadcast
      must_emit: cert_anti_entropy_rebroadcast

  - id: REQ-CLIENT-RETRY-LATE-QUORUM
    description: with 2 of 4 authorities up, the submit client keeps redialing+rebroadcasting until a late-booted third authority lets quorum form
    gate:
      - {event: client_retry_late_quorum, op: "==", count: 1}
    longinus:
      kg_anchor: transfer333-req-client-retry-late-quorum-20260803
      source: node_conformance_adapter.py
      symbol: _emit_client_retry_late_quorum
      must_emit: client_retry_late_quorum
