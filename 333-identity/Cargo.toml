[package]
name = "identity333"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "333 P2P OS L0 Identity — Ed25519 keypair + NodeID + KeyStore (ported from Kubo KeyAPI)"

# KG: SA_333_Platform, SPAN_333_Identity_KuboPort, plan-333-three-way-hybrid-2026-04-17

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
