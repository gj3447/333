# Illustrative LTDD gate for the Super-Peer announce flow. NOTE: the real discovery path
# (crates/discovery) is verified directly by receipt #2 (a real PKARR DHT put+get across two
# clients) — it does not emit these LTDD events. This gate + crates/ltdd/examples/emit_trace.rs
# demonstrate the LTDD PRIMITIVE on a representative announce trace; `service` names the emitter.
cid_env: OOPTDD_CID
service: p333.discovery
expect:
  - {event: announce_requested, op: "==", count: 1}
  - {event: packet_signed,      op: "==", count: 1}
  - {event: dht_put_ok,         op: "==", count: 1}
  - {event: resolve_ok,         op: ">=", count: 1}
