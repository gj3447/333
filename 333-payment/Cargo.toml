[package]
name = "payment333"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "333 canonical payment boundary: authenticated FastPay transfers plus BFT-ordered shared marketplace state"

[dependencies]
bincode = "1.3"
ed25519-dalek = "2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
