[workspace]
resolver = "2"
members = ["crates/identity", "crates/discovery", "crates/relay", "crates/relay-client-wasm", "crates/ltdd", "crates/metering", "crates/crdt", "crates/replay", "crates/consensus", "crates/billing", "crates/relay-billing", "crates/wal", "crates/p333-cli"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "local:p333"

# 333 v2 substrate — built PROM-style (test-first, no fake green, adversarial
# self-check). Each crate maps to a build-block from the OSS survey
# (KG: research-333-oss-survey-promv2). `identity` is PROM step 0.
