[package]
name = "p333-ltdd"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "333 v2 substrate verification: Rust-native LTDD that asserts traces read back from a store and exposes a transparent JSONL diagnostic envelope."

[features]
# The durable Store (WalStore over p333-wal) — native-only, off by default so
# the verification core stays zero-infra and the wasm graph never sees it.
wal = ["dep:p333-wal"]

[dependencies]
# Only serde_json: the LTDD envelope is plain structured data. No network, no libp2p — so the
# receipt compiles fast and stays deterministic (the verification layer must not drag in the
# substrate's heavy deps).
serde_json = "1"

[target.'cfg(unix)'.dependencies]
p333-wal = { path = "../wal", optional = true }

[dev-dependencies]
tempfile = "3"
