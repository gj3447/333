[package]
name = "p333-discovery"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "333 v2 substrate discovery: announce/resolve Super-Peer locations via PKARR, keyed by the Ed25519 DID."

[dependencies]
p333-identity = { path = "../identity" }
pkarr = "6"
anyhow = "1"

[dev-dependencies]
# local in-process DHT for deterministic receipts — never the public Mainline network
mainline = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hex = "0.4"
