# The Red artifact for a CRDT sync round: read back from the store the substrate emitted to, an
# external `ooptdd` (Python) gate asserts the replicas ACTUALLY converged — not a "merged ok"
# return value. `converged` must be present and `replica_diverged` ABSENT (the forbid primitive);
# a replica that missed a sync message emits `replica_diverged` and turns this RED.
cid_env: OOPTDD_CID
service: p333.crdt
expect:
  - {event: replica_final, op: ">=", count: 2}
  - {event: converged,     op: ">=", count: 1}
  - {absent: [{event: replica_diverged}]}
